name: KodoBluetoothRemote iOS IPA

on:
  push:
    paths:
      - "iPadViewer/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Project
        working-directory: iPadViewer
        run: xcodegen generate

      - name: Build iOS App
        working-directory: iPadViewer
        run: |
          xcodebuild \
            -project KodoBluetoothRemote.xcodeproj \
            -scheme KodoBluetoothRemote \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R iPadViewer/build/Build/Products/Release-iphoneos/KodoBluetoothRemote.app Payload/
          zip -r KodoBluetoothRemote.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: KodoBluetoothRemote-IPA
          path: KodoBluetoothRemote.ipa
          if-no-files-found: error
          retention-days: 7
