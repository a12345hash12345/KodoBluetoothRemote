name: iPad iOS Simulator Build
on:
  push:
    paths: ["iPadViewer/**"]
  pull_request:
    paths: ["iPadViewer/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: iPadViewer
        run: xcodegen generate
      - name: Build iOS Simulator app
        working-directory: iPadViewer
        run: |
          xcodebuild \
            -project KodoBluetoothRemote.xcodeproj \
            -scheme KodoBluetoothRemote \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
