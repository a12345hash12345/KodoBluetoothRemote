name: BluetoothRemote

options:
  bundleIdPrefix: com.kodo.technology
  deploymentTarget:
    iOS: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Manual

targets:
  BluetoothRemote:
    type: application
    platform: iOS
    sources:
      - App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kodo.technology.bluetoothremote
        PRODUCT_NAME: KodoBluetoothRemote
        INFOPLIST_KEY_CFBundleDisplayName: Kodo Remote
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "Kodo Remote uses Bluetooth to connect to your Android device."
        INFOPLIST_KEY_NSBluetoothPeripheralUsageDescription: "Bluetooth is used to communicate with your Android device."
        GENERATE_INFOPLIST_FILE: YES
        SUPPORTS_MACCATALYST: NO
